name: Dependency security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fail on known moderate-or-higher vulnerabilities
        run: npm audit --audit-level=moderate
